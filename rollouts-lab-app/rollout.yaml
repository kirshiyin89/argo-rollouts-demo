apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hpa-demo
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
      - name: hpa-demo
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: 200m
  strategy:
    canary:
      canaryService: hpa-demo-canary
      stableService: hpa-demo-stable
      steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 100
