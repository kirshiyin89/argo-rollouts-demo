apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-demo
  namespace: demo
spec:
  replicas: 5
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: rollouts-demo

  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:green
          ports:
            - containerPort: 8080

  strategy:
    canary:
      steps:
        - setWeight: 20

        - experiment:
            duration: 60s

            templates:
              - name: baseline
                specRef: stable

              - name: canary
                specRef: canary

            analyses:
              - name: version-check
                templateName: experiment-version-check
                requiredForCompletion: true

        - setWeight: 50

        - pause:
            duration: 10s

        - setWeight: 100