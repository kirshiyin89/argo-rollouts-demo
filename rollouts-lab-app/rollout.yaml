apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: rollout-demo
  namespace: demo

spec:
  replicas: 3

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: rollout-demo

  template:
    metadata:
      labels:
        app: rollout-demo

    spec:
      containers:
        - name: app
          image: argoproj/rollouts-demo:blue

          ports:
            - containerPort: 8080

  strategy:
    blueGreen:

      activeService: rollout-demo-active

      previewService: rollout-demo-preview

      previewReplicaCount: 1

      autoPromotionEnabled: false

      prePromotionAnalysis:
        templates:
          - templateName: rollout-demo-smoke-test
