apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vpa-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vpa-demo
  template:
    metadata:
      labels:
        app: vpa-demo
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  strategy:
    canary:
      steps:
      - setWeight: 100
