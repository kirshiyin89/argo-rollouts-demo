apiVersion: v1
kind: Service
metadata:
  name: hpa-demo-stable
spec:
  selector: {app: hpa-demo}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo-canary
spec:
  selector: {app: hpa-demo}
  ports: [{port: 80, targetPort: 80}]
---
# a single Service in front of BOTH — this is what actually load-balances
# traffic across stable+canary pods and makes the pod-ratio math matter
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo-root
spec:
  selector: {app: hpa-demo}   # matches both RSes — no version distinction
  ports: [{port: 80, targetPort: 80}]
